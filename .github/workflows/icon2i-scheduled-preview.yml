name: ICON-2I scheduled preview refresh (isolated)
on:
  schedule:
    - cron: '25 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icon2i-preview-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment only
        uses: actions/checkout@v4
        with:
          ref: test-evoluzione-icon2i
      - name: Install rendering libraries
        run: python -m pip install --disable-pip-version-check eccodes numpy pillow
      - name: Generate hourly precipitation preview
        run: python experiments/icon2i_demo.py
      - name: Validate generated frames and model age
        run: |
          python - <<'PY'
          import json,pathlib,datetime
          p=pathlib.Path('demo-icon2i')
          d=json.loads((p/'data.json').read_text())
          assert (p/'index.html').is_file()
          assert len(d['frames'])>=2
          assert len(d['frames'])==len(d['metadata'])
          assert all((p/f).is_file() and (p/f).stat().st_size>0 for f in d['frames'])
          assert all(m.get('unit')=='mm/1h' for m in d['metadata'])
          assert d.get('rendererVersion')=='icon2i-feather-v1','Preview renderer is not the validated feather version'
          # Fail closed: do not publish if the original-GRIB numerical audit is absent.
          for m in d['metadata']:
            a=m.get('audit')
            assert isinstance(a,dict),f"Missing GRIB audit at step {m['step']}"
            assert a.get('projection')=='EPSG:3857',f"Unexpected projection at {m['step']}"
            assert a.get('negativePoints')==0,f"Negative precipitation at {m['step']}"
            assert a.get('reconstructionMaxErrorMm',999)<=0.010001,f"GRIB reconstruction failed at {m['step']}"
            assert a.get('gridPoints',0)>=100,f"Too few grid points at {m['step']}"
            assert a.get('stepHours')-a.get('previousStep')==1,f"Non-hourly audit at {m['step']}"
          steps=[float(m['step']) for m in d['metadata']]
          assert all(b-a==1 for a,b in zip(steps,steps[1:]))
          now=datetime.datetime.now(datetime.timezone.utc)
          run=datetime.datetime.strptime(d['run'],'%Y%m%d%H').replace(tzinfo=datetime.timezone.utc)
          age=(now-run).total_seconds()/3600
          assert -2<=age<=24,f'ICON-2I source too old: {age:.1f} hours'
          print('Preview validated:',d['run'],'age hours:',round(age,1))
          PY
      - name: Publish isolated demo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./demo-icon2i
          publish_branch: icon2i-preview-pages
          force_orphan: true
          commit_message: 'ICON-2I scheduled experimental preview refresh'
