name: Lamone V2 · verifica pagina e CORS
on:
  push:
    branches: [lamone-v2-prototipo]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate inline JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('experiments/lamone-v2/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1
          Path('/tmp/lamone-v2.js').write_text(scripts[0])
          PY
          node --check /tmp/lamone-v2.js
      - name: Check browser cross-origin policy of regional service
        run: |
          python - <<'PY'
          import urllib.request
          u='https://allertameteo.regione.emilia-romagna.it/o/api/allerta/get-sensor-values?variabile=254%2C0%2C0%2F1%2C-%2C-%2C-%2FB13215&time=1794316500000'
          req=urllib.request.Request(u,headers={'Origin':'https://conterb80.github.io','User-Agent':'MeteoConte-LamoneV2-Test'})
          with urllib.request.urlopen(req,timeout=30) as r:
           print('HTTP',r.status,'CORS:',r.headers.get('Access-Control-Allow-Origin','NOT SET'))
           print('Content type:',r.headers.get('Content-Type'))
          PY
