name: Test isolato ICON-2I Evoluzione
on:
  push:
    branches: [test-evoluzione-icon2i]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install GRIB reader and renderer
        run: python -m pip install --disable-pip-version-check eccodes numpy pillow
      - name: Generate isolated precipitation animation
        run: python experiments/icon2i_demo.py
      - name: Upload preview (HTML + PNG frames)
        uses: actions/upload-artifact@v4
        with:
          name: evoluzione-icon2i-demo
          path: demo-icon2i/
          if-no-files-found: error
          retention-days: 7
