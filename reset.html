<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Meteo Conte RC31</title><style>body{font-family:system-ui;background:#031923;color:#eef;padding:32px;text-align:center}button{padding:14px 20px;border:0;border-radius:14px;font-weight:700}</style></head><body><h1>Reset RC31</h1><p id="s">Pulizia cache in corso…</p><script>(async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);['mc_pretemp_cache','mc_pretemp_cache_meta','mc_pretemp_last_check'].forEach(k=>localStorage.removeItem(k));document.getElementById('s').textContent='Pulizia completata. Riapro Meteo Conte…';setTimeout(()=>location.replace('./?v=rc31-'+Date.now()),1200)}catch(e){document.getElementById('s').textContent='Pulizia completata parzialmente: '+e.message}})();</script></body></html>
