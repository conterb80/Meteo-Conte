<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Meteo Conte Meteo Conte 1.1</title><style>body{font-family:system-ui;background:#061923;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:420px;padding:28px;text-align:center;border:1px solid #2d6174;border-radius:22px;background:#0a2a38}b{font-size:24px}p{color:#c9dce4}a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:14px;background:#67e09a;color:#042319;font-weight:800;text-decoration:none}</style></head><body><div class="box"><b id="title">Pulizia in corso…</b><p id="msg">Cancello cache e vecchi service worker.</p><a href="./index.html?v=rc35-3" id="go">Apri Meteo Conte Meteo Conte 1.1</a></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));['mc_pretemp_cache','mc_pretemp_cache_meta','mc_pretemp_last_check'].forEach(k=>localStorage.removeItem(k));document.getElementById('title').textContent='Reset completato';document.getElementById('msg').textContent='Cache e service worker precedenti rimossi. Tocca il pulsante sotto.';}catch(e){document.getElementById('title').textContent='Reset quasi completato';document.getElementById('msg').textContent='Apri comunque Meteo Conte 1.1 con il pulsante sotto.';}})();</script></body></html>
